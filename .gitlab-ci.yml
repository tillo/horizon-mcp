include:
  - project: mdapi/ci-templates
    file: /dast.yml
    ref: main
  - project: mdapi/ci-templates
    file: /sast.yml
    ref: main
  - project: mdapi/ci-templates
    file: /notify.yml
    ref: main
  - project: mdapi/ci-templates
    file: /buildkit-before-script.yml
    ref: main
  - project: mdapi/ci-templates
    file: /build.yml
    ref: main
  - project: mdapi/ci-templates
    file: /secret-scan.yml
    ref: main
  - project: mdapi/ci-templates
    file: /scan.yml
    ref: main

stages:
  - build
  - tag
  - scan
  - web-scan
  - notify
  - code-scan

buildkit:
  extends: .buildkit-build
  variables:
    # Route the base image (FROM ${REGISTRY}node:...) through the group dependency
    # proxy in CI. ARG REGISTRY defaults to empty so the same Dockerfile still builds
    # from Docker Hub in the GitHub Actions workflow.
    BUILD_ARGS: "--opt build-arg:REGISTRY=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/"

# Mints :<mcp-version>-mdapi.<pipeline> from /etc/image-version (see Dockerfile),
# pointing at the same digest. Lane-B / Renovate consumers; :latest stays floating
# for Keel.
version-tag:
  extends: .version-tag
  needs:
    - buildkit

# CVE scan via the shared job in mdapi/ci-templates (scan.yml):
# pinned grype + sha256, registry auth, and notifies only for
# HIGH/CRITICAL that actually have a fix.
scan:
  extends: .grype-scan

notify-failure:
  extends: .notify-failure

secret-scan:
  extends: .secret-scan

# Source scans (mdapi/ci-templates /sast.yml, infra-7rog.39/.40): Semgrep CE and
# osv-scanner on the default branch, non-blocking. The job NAMES are what the
# DefectDojo sync imports (sast -> semgrep-report.json, sca-source -> osv-report.json).
sast:
  extends: .semgrep

sca-source:
  extends: .osv-source

# Passive DAST of the image this pipeline built (ci-templates /dast.yml,
# infra-7rog.31.16): ZAP's baseline spider, no attacks, non-blocking; the
# DefectDojo sync imports zap-report.xml from this job name.
# nginx's bearer gate in front of the stdio MCP server, placeholder token and no
# Horizon credentials.
dast-baseline:
  extends: .zap-baseline
  needs: [buildkit]
  # The image this pipeline built, on zot: mdapi/<project> on the default
  # branch, mdapi-dev/<project> elsewhere (ci-templates .zot-built-image).
  rules: !reference [.zot-built-image, rules]
  services:
    - name: ${BUILT_IMAGE}
      alias: app
  variables:
    DAST_TARGET: http://app:8080/
    MCP_BEARER_TOKEN: 'dast-placeholder'
